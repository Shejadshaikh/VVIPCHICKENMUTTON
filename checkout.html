<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VVIP Checkout</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="logo" href="index.html"><strong>VVIP</strong><small>CHECKOUT</small></a></header><main class="section"><div class="heading"><span>SECURE CHECKOUT</span><h2>Delivery details</h2></div><form class="box" style="max-width:650px;margin:auto" onsubmit="place(event)"><label>Name<br><input required name="name" style="width:100%;padding:13px;margin:7px 0 15px"></label><label>Mobile<br><input required name="mobile" type="tel" style="width:100%;padding:13px;margin:7px 0 15px"></label><label>Address<br><textarea required name="address" style="width:100%;padding:13px;margin:7px 0 15px;height:90px"></textarea></label><label>Payment<br><select name="payment" style="width:100%;padding:13px;margin:7px 0 20px"><option>Paytm / UPI</option><option>Debit / Credit Card</option><option>Net Banking</option><option>COD</option><option>Pay at Shop</option></select></label><div style="padding:15px;background:#f5eee5;margin-bottom:18px"><b>HALAL</b> — relevant meat items will be labelled on the order/packing flow.</div><button class="btn gold full">Place Order</button></form></main><script>function place(e){e.preventDefault();alert('Order request captured. Production Paytm payment + backend confirmation will activate after secure server configuration.');}</script></body></html>
